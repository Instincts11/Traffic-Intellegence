name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Build Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: traffic-app/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: traffic-app/web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          FLASK_URL: http://127.0.0.1:5000
          NEXT_TELEMETRY_DISABLED: "1"

  api:
    name: Check Flask API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: traffic-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight deps
        run: pip install -r requirements-render.txt
      - name: Import app module
        run: python -c "import app; print('ok', app.app.name)"

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [web, api]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./traffic-app
          file: ./traffic-app/Dockerfile
          push: false
          tags: traffipi-api:ci
          build-args: |
            REQUIREMENTS_FILE=requirements-render.txt
      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: ./traffic-app/web
          file: ./traffic-app/web/Dockerfile
          push: false
          tags: traffipi-web:ci
          build-args: |
            FLASK_URL=http://api:5000
