name: Deploy AWS (manual)

# Runs only when you click "Run workflow" in GitHub Actions.
# Requires GitHub secrets listed in devops/WHAT_YOU_NEED.md

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to push"
        required: true
        default: "latest"

permissions:
  contents: read
  id-token: write

jobs:
  push-ecr:
    name: Build and push to ECR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO: ${{ secrets.ECR_API_REPO }}
          TAG: ${{ inputs.image_tag }}
        run: |
          docker build \
            -t "$REGISTRY/$REPO:$TAG" \
            --build-arg REQUIREMENTS_FILE=requirements-render.txt \
            ./traffic-app
          docker push "$REGISTRY/$REPO:$TAG"

      - name: Build and push Web
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO: ${{ secrets.ECR_WEB_REPO }}
          TAG: ${{ inputs.image_tag }}
          FLASK_URL: ${{ secrets.FLASK_URL }}
        run: |
          docker build \
            -t "$REGISTRY/$REPO:$TAG" \
            --build-arg "FLASK_URL=${FLASK_URL:-http://api:5000}" \
            ./traffic-app/web
          docker push "$REGISTRY/$REPO:$TAG"
