services:
  api:
    build:
      context: ./traffic-app
      dockerfile: Dockerfile
      args:
        REQUIREMENTS_FILE: requirements-render.txt
    ports:
      - "5000:5000"
    environment:
      RENDER: "1"
      PORT: "5000"
    volumes:
      - api_uploads:/app/static/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ./traffic-app/web
      dockerfile: Dockerfile
      args:
        FLASK_URL: http://api:5000
    ports:
      - "3000:3000"
    environment:
      FLASK_URL: http://api:5000
      PORT: "3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  api_uploads:
