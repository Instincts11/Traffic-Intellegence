apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffipi-api
  namespace: traffipi
  labels:
    app: traffipi-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffipi-api
  template:
    metadata:
      labels:
        app: traffipi-api
    spec:
      containers:
        - name: api
          image: traffic-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: RENDER
              value: "1"
            - name: PORT
              value: "5000"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: traffipi
  labels:
    app: traffipi-api
spec:
  selector:
    app: traffipi-api
  ports:
    - name: http
      port: 5000
      targetPort: http
